<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Quản Lý Đơn Hàng - Lưu Cục Bộ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body class="bg-gray-100 text-sm sm:text-base">

    <!-- THANH MENU TAB BÊN TRÊN -->
    <div class="bg-white shadow mb-4 sticky top-0 z-10">
        <div class="max-w-6xl mx-auto flex overflow-x-auto">
            <button onclick="switchTab('tab-product', 'section-product')" id="tab-product" class="flex-1 py-4 font-bold text-center border-b-4 border-blue-600 text-blue-600 whitespace-nowrap">1. Sản Phẩm</button>
            <button onclick="switchTab('tab-order', 'section-order')" id="tab-order" class="flex-1 py-4 font-bold text-center border-b-4 border-transparent text-gray-500 whitespace-nowrap">2. Lập Đơn</button>
            <button onclick="switchTab('tab-history', 'section-history')" id="tab-history" class="flex-1 py-4 font-bold text-center border-b-4 border-transparent text-gray-500 whitespace-nowrap">3. Lịch Sử</button>
        </div>
    </div>

    <div class="max-w-6xl mx-auto p-2 sm:p-6 mb-10">
        
        <!-- ================= PHẦN 1: QUẢN LÝ SẢN PHẨM ================= -->
        <div id="section-product" class="bg-white p-4 sm:p-6 rounded-lg shadow block">
            <h2 class="text-xl sm:text-2xl font-bold mb-4">Thêm / Sửa Sản Phẩm</h2>
            
            <div class="flex flex-col sm:flex-row gap-3 mb-4">
                <div class="w-full">
                    <input type="text" id="prodName" placeholder="Tên sản phẩm (Vd: Cồn 90 độ)" class="border p-3 rounded w-full focus:outline-none focus:ring-2 focus:ring-blue-400">
                </div>
                <div class="w-full sm:w-1/3">
                    <input type="number" id="prodPrice" placeholder="Giá (Vd: 21000)" class="border p-3 rounded w-full focus:outline-none focus:ring-2 focus:ring-blue-400">
                </div>
                <button id="btnSubmitProduct" onclick="handleProductSubmit()" class="bg-blue-500 text-white font-bold px-4 py-3 rounded w-full sm:w-auto active:bg-blue-700 shadow">Thêm SP</button>
                <button id="btnCancelEdit" onclick="cancelEdit()" class="bg-gray-400 text-white font-bold px-4 py-3 rounded w-full sm:w-auto active:bg-gray-600 shadow hidden">Hủy Sửa</button>
            </div>
            
            <div class="overflow-x-auto border rounded">
                <table class="w-full text-left border-collapse min-w-[450px]">
                    <thead>
                        <tr class="bg-gray-200">
                            <th class="p-3 border">Sản phẩm</th>
                            <th class="p-3 border">Giá (đ)</th>
                            <th class="p-3 border text-center w-36">Hành động</th>
                        </tr>
                    </thead>
                    <tbody id="productTableBody">
                    </tbody>
                </table>
            </div>
        </div>

        <!-- ================= PHẦN 2: LẬP ĐƠN HÀNG ================= -->
        <div id="section-order" class="bg-white p-4 sm:p-6 rounded-lg shadow hidden">
            <h2 class="text-xl sm:text-2xl font-bold mb-4">Lập Đơn Hàng Mới</h2>
            
            <div class="flex flex-col sm:flex-row gap-3 mb-4 p-3 bg-gray-50 border rounded">
                <select id="selectProduct" class="border p-3 rounded w-full focus:outline-none focus:ring-2 focus:ring-green-400 bg-white">
                    <option value="">-- Chọn sản phẩm --</option>
                </select>
                <div class="flex gap-2 w-full sm:w-auto">
                    <input type="number" id="orderQty" placeholder="SL" value="1" min="1" class="border p-3 rounded w-24 text-center focus:outline-none focus:ring-2 focus:ring-green-400">
                    <button onclick="addToOrder()" class="bg-green-500 text-white font-bold px-4 py-3 rounded w-full whitespace-nowrap active:bg-green-700 shadow">Thêm vào Đơn</button>
                </div>
            </div>

            <div id="receipt" class="border-2 border-dashed border-gray-300 p-4 mb-4 bg-yellow-50 rounded relative">
                <div class="text-center mb-3">
                    <h3 class="font-bold text-xl uppercase">HÓA ĐƠN BÁN HÀNG</h3>
                    <p class="text-sm text-gray-500">Ngày: <span id="currentDate" class="font-semibold"></span></p>
                </div>
                
                <ul id="orderItems" class="mb-2 border-t border-b border-gray-300 py-3 min-h-[80px] text-sm sm:text-base flex flex-col gap-2">
                    <li class="text-center text-gray-400 italic" id="emptyOrderText">Đơn hàng đang trống...</li>
                </ul>
                <div class="text-right font-bold text-xl text-red-600 mt-2">
                    Tổng cộng: <span id="orderTotal">0</span> đ
                </div>
            </div>
            
            <div class="flex flex-col sm:flex-row gap-3">
                <button onclick="saveOrder()" class="bg-blue-600 text-white font-bold px-4 py-3 rounded w-full active:bg-blue-800 shadow text-lg">Lưu Đơn Hàng</button>
                <button onclick="exportToImage()" class="bg-purple-500 text-white font-bold px-4 py-3 rounded w-full sm:w-1/3 active:bg-purple-700 shadow">Xuất Ảnh</button>
            </div>
        </div>

        <!-- ================= PHẦN 3: LỊCH SỬ ĐƠN HÀNG ================= -->
        <div id="section-history" class="bg-white p-4 sm:p-6 rounded-lg shadow hidden relative">
             <h2 class="text-xl sm:text-2xl font-bold mb-4">Lịch Sử & Tính Tổng</h2>
            
            <div class="bg-blue-50 border border-blue-200 p-4 rounded mb-4 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
                <div>
                    <p class="text-gray-700">Tổng tiền các đơn đang chọn:</p>
                    <p class="font-bold text-2xl text-red-600"><span id="selectedSumTotal">0</span> đ</p>
                </div>
                <button onclick="exportSummaryImage()" class="bg-purple-600 text-white font-bold px-5 py-3 rounded w-full sm:w-auto active:bg-purple-800 shadow">📸 Xuất Ảnh Tổng</button>
            </div>
            
            <div class="overflow-x-auto border rounded">
                <table class="w-full text-left border-collapse min-w-[500px]">
                    <thead>
                        <tr class="bg-gray-200">
                            <th class="p-3 border text-center w-12">Chọn</th>
                            <th class="p-3 border">Mã Đơn</th>
                            <th class="p-3 border">Ngày</th>
                            <th class="p-3 border">Tổng Tiền (đ)</th>
                            <th class="p-3 border text-center w-24">Hành động</th>
                        </tr>
                    </thead>
                    <tbody id="historyTableBody">
                    </tbody>
                </table>
            </div>

            <!-- KHUNG ẨN ĐỂ CHỤP ẢNH TỔNG KẾT -->
            <div id="summaryReceipt" class="absolute top-0 left-[-9999px] border-2 border-solid border-blue-400 p-6 bg-white rounded-lg w-[400px]">
                <div class="text-center mb-4">
                    <h3 class="font-bold text-2xl text-blue-700 uppercase">BẢNG KÊ DOANH THU</h3>
                    <p class="text-sm text-gray-500">Ngày xuất: <span id="summaryDate"></span></p>
                </div>
                <div class="font-bold text-gray-700 border-b-2 border-gray-300 pb-2 mb-2 flex justify-between">
                    <span>Mã Đơn</span>
                    <span>Số Tiền</span>
                </div>
                <ul id="summaryItems" class="mb-2 text-sm flex flex-col gap-2 min-h-[50px]">
                    <!-- Chi tiết các đơn sẽ được JavaScript đổ vào đây -->
                </ul>
                <div class="border-t-2 border-gray-300 pt-3 mt-3 text-right font-bold text-2xl text-red-600">
                    Tổng cộng: <span id="summaryTotalAmount">0</span> đ
                </div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('currentDate').innerText = new Date().toLocaleDateString('vi-VN');

        let products = [];
        let currentOrderItems = [];
        let orderHistory = [];
        let editingProductId = null;

        // ================= TẢI VÀ LƯU DỮ LIỆU TỪ MÁY =================
        function loadLocalData() {
            const savedProducts = localStorage.getItem('myProducts');
            const savedHistory = localStorage.getItem('myHistory');

            if (savedProducts) {
                products = JSON.parse(savedProducts);
            } else {
                products = [
                    { id: 1, name: "Cồn 500ml - 70", price: 21000 },
                    { id: 2, name: "Cồn 500ml - 90", price: 24000 }
                ];
                saveDataToLocal();
            }

            if (savedHistory) {
                orderHistory = JSON.parse(savedHistory);
            }

            renderProducts();
            updateSelectProduct();
            renderHistory();
        }

        function saveDataToLocal() {
            localStorage.setItem('myProducts', JSON.stringify(products));
            localStorage.setItem('myHistory', JSON.stringify(orderHistory));
        }

        window.onload = loadLocalData;

        // ================= CHUYỂN TAB =================
        function switchTab(tabBtnId, sectionId) {
            document.getElementById('section-product').classList.add('hidden');
            document.getElementById('section-order').classList.add('hidden');
            document.getElementById('section-history').classList.add('hidden');
            
            ['tab-product', 'tab-order', 'tab-history'].forEach(t => {
                const el = document.getElementById(t);
                el.classList.remove('border-blue-600', 'text-blue-600');
                el.classList.add('border-transparent', 'text-gray-500');
            });

            document.getElementById(sectionId).classList.remove('hidden');
            const activeTab = document.getElementById(tabBtnId);
            activeTab.classList.remove('border-transparent', 'text-gray-500');
            activeTab.classList.add('border-blue-600', 'text-blue-600');
        }

        // ================= SẢN PHẨM =================
        function handleProductSubmit() {
            const nameInput = document.getElementById('prodName');
            const priceInput = document.getElementById('prodPrice');
            const name = nameInput.value.trim();
            const price = priceInput.value.trim();

            if (!name) { alert("Vui lòng nhập tên sản phẩm!"); return; }
            if (!price || isNaN(price) || Number(price) <= 0) { alert("Giá phải là số hợp lệ!"); return; }

            if (editingProductId) {
                const index = products.findIndex(p => p.id === editingProductId);
                if(index !== -1) {
                    products[index] = { id: editingProductId, name: name, price: Number(price) };
                }
                cancelEdit();
            } else {
                products.push({ id: Date.now(), name: name, price: Number(price) });
            }

            nameInput.value = ''; priceInput.value = '';
            saveDataToLocal();
            renderProducts();
            updateSelectProduct();
        }

        function prepareEditProduct(index) {
            const p = products[index];
            document.getElementById('prodName').value = p.name;
            document.getElementById('prodPrice').value = p.price;
            editingProductId = p.id;

            const btnSubmit = document.getElementById('btnSubmitProduct');
            btnSubmit.innerText = "Cập nhật SP";
            btnSubmit.classList.replace('bg-blue-500', 'bg-orange-500');
            
            document.getElementById('btnCancelEdit').classList.remove('hidden');
        }

        function cancelEdit() {
            editingProductId = null;
            document.getElementById('prodName').value = '';
            document.getElementById('prodPrice').value = '';
            
            const btnSubmit = document.getElementById('btnSubmitProduct');
            btnSubmit.innerText = "Thêm SP";
            btnSubmit.classList.replace('bg-orange-500', 'bg-blue-500');
            document.getElementById('btnCancelEdit').classList.add('hidden');
        }

        function deleteProduct(index) {
            if(!confirm("Bạn có chắc chắn muốn xóa sản phẩm này?")) return;
            products.splice(index, 1);
            saveDataToLocal();
            renderProducts();
            updateSelectProduct();
        }

        function renderProducts() {
            const tbody = document.getElementById('productTableBody');
            tbody.innerHTML = '';
            if(products.length === 0) {
                tbody.innerHTML = `<tr><td colspan="3" class="text-center p-4 text-gray-500">Chưa có sản phẩm.</td></tr>`;
                return;
            }
            products.forEach((p, index) => {
                tbody.innerHTML += `
                    <tr class="border-b hover:bg-gray-50">
                        <td class="p-3 border-r font-medium">${p.name}</td>
                        <td class="p-3 border-r font-semibold text-blue-600">${p.price.toLocaleString('vi-VN')}</td>
                        <td class="p-3 text-center flex justify-center gap-2">
                            <button onclick="prepareEditProduct(${index})" class="text-orange-600 font-bold px-3 py-1 bg-orange-100 rounded">Sửa</button>
                            <button onclick="deleteProduct(${index})" class="text-red-500 font-bold px-3 py-1 bg-red-100 rounded">Xóa</button>
                        </td>
                    </tr>
                `;
            });
        }

        function updateSelectProduct() {
            const select = document.getElementById('selectProduct');
            select.innerHTML = '<option value="">-- Chọn sản phẩm --</option>';
            products.forEach((p, index) => {
                select.innerHTML += `<option value="${index}">${p.name} - ${p.price.toLocaleString('vi-VN')} đ</option>`;
            });
        }

        // ================= LẬP ĐƠN HÀNG =================
        function addToOrder() {
            const select = document.getElementById('selectProduct');
            const qtyInput = document.getElementById('orderQty');
            const selectedIndex = select.value;
            const qty = parseInt(qtyInput.value);

            if (selectedIndex === "") { alert("Vui lòng chọn sản phẩm!"); return; }
            if (isNaN(qty) || qty <= 0) { alert("Số lượng phải lớn hơn 0!"); return; }

            const p = products[selectedIndex];
            currentOrderItems.push({ name: p.name, price: p.price, qty: qty, total: p.price * qty });
            renderReceipt();
        }

        function renderReceipt() {
            const ul = document.getElementById('orderItems');
            ul.innerHTML = '';
            let totalOrderValue = 0;

            if (currentOrderItems.length === 0) {
                ul.innerHTML = `<li class="text-center text-gray-400 italic" id="emptyOrderText">Đơn hàng đang trống...</li>`;
                document.getElementById('orderTotal').innerText = "0";
                return;
            }

            currentOrderItems.forEach((item, index) => {
                totalOrderValue += item.total;
                ul.innerHTML += `
                    <li class="flex justify-between items-center bg-white p-2 rounded border border-gray-200">
                        <div>
                            <p class="font-bold text-gray-800">${item.name}</p>
                            <p class="text-xs text-gray-500">${item.price.toLocaleString('vi-VN')} đ x ${item.qty}</p>
                        </div>
                        <div class="flex items-center gap-3">
                            <span class="font-bold text-blue-600">${item.total.toLocaleString('vi-VN')} đ</span>
                            <button onclick="removeOrderItem(${index})" class="text-red-500 font-bold bg-red-100 px-2 py-1 rounded delete-btn-receipt">X</button>
                        </div>
                    </li>
                `;
            });
            document.getElementById('orderTotal').innerText = totalOrderValue.toLocaleString('vi-VN');
        }

        function removeOrderItem(index) {
            currentOrderItems.splice(index, 1);
            renderReceipt();
        }

        function saveOrder() {
            if (currentOrderItems.length === 0) { alert("Đơn hàng đang trống!"); return; }

            const orderId = "DH" + Math.floor(10000 + Math.random() * 90000);
            const date = new Date().toLocaleDateString('vi-VN') + " " + new Date().toLocaleTimeString('vi-VN', {hour: '2-digit', minute:'2-digit'});
            const totalValue = parseInt(document.getElementById('orderTotal').innerText.replace(/\./g, ''));
            const detailsStr = currentOrderItems.map(item => `${item.name} (x${item.qty})`).join(', ');

            const orderData = { id: orderId, date: date, details: detailsStr, total: totalValue };
            
            orderHistory.push(orderData);
            saveDataToLocal(); 

            alert(`Đã lưu thành công đơn hàng: ${orderId}`);
            currentOrderItems = [];
            renderReceipt();
            renderHistory();
        }

        // ================= LỊCH SỬ =================
        function renderHistory() {
            const tbody = document.getElementById('historyTableBody');
            tbody.innerHTML = '';
            if(orderHistory.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="text-center p-4 text-gray-500">Chưa có đơn hàng nào được lưu.</td></tr>`;
                return;
            }

            [...orderHistory].reverse().forEach((order, index) => {
                const realIndex = orderHistory.length - 1 - index; // Lưu vị trí thực để xuất ảnh chính xác
                tbody.innerHTML += `
                    <tr class="border-b hover:bg-gray-50">
                        <td class="p-3 border-r text-center">
                            <input type="checkbox" class="w-5 h-5 order-checkbox cursor-pointer" value="${order.total}" data-real-index="${realIndex}" onchange="calculateSelectedTotal()">
                        </td>
                        <td class="p-3 border-r font-bold text-blue-600">
                            ${order.id}
                            <div class="text-xs text-gray-400 font-normal mt-1">${order.details}</div>
                        </td>
                        <td class="p-3 border-r text-sm">${order.date}</td>
                        <td class="p-3 font-bold border-r text-red-600">${order.total.toLocaleString('vi-VN')}</td>
                        <td class="p-3 text-center">
                            <button onclick="deleteHistoryOrder(${realIndex})" class="text-red-500 font-bold px-3 py-1 bg-red-100 rounded">Xóa</button>
                        </td>
                    </tr>
                `;
            });
            calculateSelectedTotal(); 
        }

        function deleteHistoryOrder(index) {
            if(confirm("Bạn có chắc muốn xóa đơn hàng này khỏi lịch sử?")) {
                orderHistory.splice(index, 1);
                saveDataToLocal(); 
                renderHistory();
            }
        }

        function calculateSelectedTotal() {
            const checkboxes = document.querySelectorAll('.order-checkbox');
            let sum = 0;
            checkboxes.forEach(cb => { if (cb.checked) sum += parseInt(cb.value); });
            document.getElementById('selectedSumTotal').innerText = sum.toLocaleString('vi-VN');
        }

        // ================= XUẤT ẢNH =================
        
        // Xuất ảnh cho Đơn Hàng Lẻ
        function exportToImage() {
            if (currentOrderItems.length === 0) return alert("Không có sản phẩm để xuất hóa đơn!");
            const deleteBtns = document.querySelectorAll('.delete-btn-receipt');
            deleteBtns.forEach(btn => btn.style.display = 'none');

            html2canvas(document.getElementById('receipt'), { scale: 2 }).then(canvas => {
                const link = document.createElement('a');
                link.download = `HoaDon_${new Date().getTime()}.png`;
                link.href = canvas.toDataURL("image/png");
                link.click();
                deleteBtns.forEach(btn => btn.style.display = 'block');
            });
        }

        // Xuất ảnh cho Bảng Tổng Các Đơn Hàng Được Chọn
        function exportSummaryImage() {
            const checkboxes = document.querySelectorAll('.order-checkbox');
            let selectedOrders = [];
            let sum = 0;

            // Nhặt các đơn được tick
            checkboxes.forEach(cb => {
                if (cb.checked) {
                    const realIndex = cb.getAttribute('data-real-index');
                    selectedOrders.push(orderHistory[realIndex]);
                    sum += parseInt(cb.value);
                }
            });

            if (selectedOrders.length === 0) {
                alert("Vui lòng tích chọn ít nhất 1 đơn hàng để xuất ảnh tổng kết!");
                return;
            }

            // Ghi ngày giờ xuất
            document.getElementById('summaryDate').innerText = new Date().toLocaleDateString('vi-VN') + " " + new Date().toLocaleTimeString('vi-VN', {hour: '2-digit', minute:'2-digit'});
            
            // Đổ dữ liệu vào khung Bảng Kê
            const ul = document.getElementById('summaryItems');
            ul.innerHTML = '';
            selectedOrders.forEach(order => {
                ul.innerHTML += `
                    <li class="flex justify-between items-center py-2 border-b border-gray-100">
                        <div>
                            <p class="font-bold text-gray-800">${order.id}</p>
                            <p class="text-xs text-gray-500">${order.date}</p>
                        </div>
                        <span class="font-bold text-blue-600">${order.total.toLocaleString('vi-VN')} đ</span>
                    </li>
                `;
            });
            document.getElementById('summaryTotalAmount').innerText = sum.toLocaleString('vi-VN');

            // Lấy khung chứa bảng kê, hiển thị nó ra (bằng cách đổi position) và chụp
            const summaryReceipt = document.getElementById('summaryReceipt');
            summaryReceipt.style.left = '0'; // Kéo nó vào khung hình để chụp
            summaryReceipt.style.position = 'relative';

            setTimeout(() => {
                html2canvas(summaryReceipt, { scale: 2 }).then(canvas => {
                    const link = document.createElement('a');
                    link.download = `BangKeTong_${new Date().getTime()}.png`;
                    link.href = canvas.toDataURL("image/png");
                    link.click();
                    
                    // Chụp xong thì giấu nó đi lại
                    summaryReceipt.style.position = 'absolute';
                    summaryReceipt.style.left = '-9999px';
                });
            }, 100);
        }
    </script>
</body>
</html>
